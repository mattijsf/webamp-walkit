name: Pages

# Publishes the demo, with walkit drawing the windows, to GitHub Pages.
on:
  push:
    branches: [walkit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build the demo
        run: npx turbo build --filter=webamp-demo
        env:
          NODE_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/webamp-demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
